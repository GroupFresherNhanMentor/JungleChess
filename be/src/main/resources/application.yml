spring:
  application:
    name: jungleChess

  # ─── DataSource ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/jc
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ─── R2DBC ────────────────────────────────────────────────────
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/jc
    username: postgres
    password: postgres

  # ─── Flyway ───────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── RSocket ──────────────────────────────────────────────────
  rsocket:
    server:
      transport: websocket
      mapping-path: /rsocket

  # ─── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379


# ─── JWT (Application Custom Configs) ─────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:k8wT5KF1ZrFojvpXJbhXOcYVv44lCKvOwQudCRY6HjxxTGH3WQbQDHEFZjhS+mCE}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:Admin@123}
      full-name: ${SEED_ADMIN_FULL_NAME:System Administrator}
      employee-id: ${SEED_ADMIN_EMPLOYEE_ID:JC-0001}

# ─── Swagger / OpenAPI ────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

# ─── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────────────────────
logging:
  level:
    org.jooq.tools.LoggerListener: DEBUG
    fpt.qn.junglechess: DEBUG