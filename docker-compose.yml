services:

  db:
    image: postgres:17-alpine
    container_name: jc-db
    environment:
      POSTGRES_DB: jc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: jc-redis
    ports:
      - "6379:6379"
    volumes:
      - jc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  be:
    build:
      context: ./be
    container_name: jc-be
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/jc
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    restart: always

  bot-worker:
    build:
      context: ./bot-worker
    container_name: jc-bot-worker
    environment:
      - SERVER_URL=ws://jc-be:8080/ws
      - BACKEND_HTTP_URL=http://jc-be:8080
    depends_on:
      be:
        condition: service_healthy
    restart: always

  win-bot:
    build:
      context: ./win-bot
    container_name: jc-win-bot
    environment:
      - SERVER_URL=ws://jc-be:8080/ws
      - BACKEND_HTTP_URL=http://jc-be:8080
      - BOT_USERNAME=win-bot
      - BOT_PASSWORD=WinBot@password1
      - DIFFICULTY=HARD
    depends_on:
      be:
        condition: service_healthy
    restart: always

  fe:
    build:
      context: ./fe
    container_name: jc-fe
    ports:
      - "80:80"
    depends_on:
      - be
    restart: always

volumes:
  jc-db-data:
    driver: local
  jc-redis-data:
    driver: local
