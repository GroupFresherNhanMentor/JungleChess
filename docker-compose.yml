services:
  db:
    image: postgres:18-alpine
    container_name: jc-db
    environment:
      POSTGRES_DB: jc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # SỬA LỖI: Trỏ đúng vào thư mục /data của postgres
      - jc-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: jc-redis
    ports:
      - "6379:6379"
    volumes:
      - jc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

