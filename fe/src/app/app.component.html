<h1 id="game-title">{{ loc.translate('gameTitle') }}</h1>

<!-- View 1: Lobby Screen -->
<ng-container *ngIf="activeView === 'LOBBY'">
  <app-lobby (selectRoom)="onSelectRoomFromLobby($event)"></app-lobby>
</ng-container>

<!-- View 2: Active Game Room Screen -->
<ng-container *ngIf="activeView === 'GAME'">
  <!-- Game Controls Bar -->
  <app-game-controls
    [currentLang]="currentLang"
    (currentLangChange)="currentLang = $event"
    [gameMode]="gameMode"
    (gameModeChange)="onGameModeChange($event)"
    [firstMoveSide]="firstMoveSide"
    (firstMoveSideChange)="onFirstMoveSideChange($event)"
    [aiDepth]="aiDepth"
    (aiDepthChange)="aiDepth = $event"
    [aiTimeLimit]="aiTimeLimit"
    (aiTimeLimitChange)="aiTimeLimit = $event"
    [actualAiDepth]="actualAiDepth"
    (openRulesModal)="openRulesModal()"
  ></app-game-controls>

  <!-- Page Wrapper to align Game Layout and Side Chat Box -->
  <div id="game-page-wrapper">
    <!-- Main Game Layout Container -->
    <div id="game-layout">
      <!-- Left Panel -->
      <app-left-panel
        [capturedByRed]="capturedByRed"
        [canUndo]="moveHistory.length > 0"
        (resetGame)="initGame()"
        (undoMove)="undoMove()"
        (randomizeBoard)="randomizeBoard()"
        (openRules)="openRulesModal()"
        (backToLobby)="onBackToLobby()"
      ></app-left-panel>

      <!-- Main Board Area -->
      <div id="main-game-area">
        <app-board
          [pieces]="pieces"
          [selectedPos]="selectedPos"
          [validMoves]="validMoves"
          [lastMove]="getLastMove()"
          (squareClick)="onSquareClick($event)"
        ></app-board>

        <!-- Status Message -->
        <div id="status">{{ statusMessage }}</div>

        <!-- Win Chance Bar -->
        <app-win-chance-bar [pieces]="pieces"></app-win-chance-bar>
      </div>

      <!-- Right Panel -->
      <app-right-panel
        [capturedByBlue]="capturedByBlue"
        [moveHistory]="moveHistory"
        [currentTurn]="currentTurn"
      ></app-right-panel>
    </div>

    <!-- Side Chat Box -->
    <div id="side-chat-wrapper">
      <app-chat
        [messages]="chatMessages"
        [currentTurn]="currentTurn"
        (sendMessage)="onSendChatMessage($event)"
      ></app-chat>
    </div>
  </div>
</ng-container>

<!-- Rules Popup Modal -->
<app-game-rules-modal
  [isOpen]="isRulesModalOpen"
  (close)="closeRulesModal()"
></app-game-rules-modal>
