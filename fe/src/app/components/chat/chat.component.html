<div id="chat-panel" class="chat-container">
  <h2>💬 {{ loc.translate('chatTitle') }}</h2>

  <!-- Messages List -->
  <div #chatContainer class="chat-messages-list">
    <div *ngIf="messages.length === 0" class="chat-empty">
      <span>{{ loc.translate('chatPlaceholder') }}</span>
    </div>

    <div
      *ngFor="let msg of messages"
      class="chat-message-item"
      [ngClass]="{
        'system-msg': msg.isSystem,
        'blue-sender': msg.side === 0,
        'red-sender': msg.side === 1
      }"
    >
      <ng-container *ngIf="msg.isSystem">
        <span class="system-text">ℹ️ {{ msg.text }}</span>
      </ng-container>
      <ng-container *ngIf="!msg.isSystem">
        <div class="msg-header">
          <span
            class="sender-badge"
            [ngClass]="msg.side === 0 ? 'player0' : (msg.side === 1 ? 'player1' : 'spectator')"
          >
            {{ msg.sender }}
          </span>
          <span class="msg-time">{{ msg.timestamp }}</span>
        </div>
        <div class="msg-body">{{ msg.text }}</div>
      </ng-container>
    </div>
  </div>

  <!-- Quick Taunts / Emotes -->
  <div class="quick-emotes">
    <button
      type="button"
      *ngFor="let emote of quickEmotes"
      (click)="sendQuickEmote(emote)"
      class="emote-btn"
    >
      {{ emote }}
    </button>
  </div>

  <!-- Chat Input Form -->
  <form (submit)="onSend($event)" class="chat-input-form">
    <input
      type="text"
      [(ngModel)]="newMessageText"
      name="messageText"
      [placeholder]="loc.translate('chatPlaceholder')"
      class="chat-input"
      autocomplete="off"
    />
    <!-- Emoji picker toggle -->
    <div class="emoji-picker-wrap">
      <button
        type="button"
        (click)="toggleEmojiPicker()"
        class="emoji-toggle-btn"
        title="Emoji"
        aria-label="Emoji"
      >
        😊
      </button>
      <div *ngIf="emojiPickerOpen" class="emoji-dropdown" (click)="$event.stopPropagation()">
        <button
          type="button"
          *ngFor="let emojiItem of emojiList"
          (click)="pickEmoji(emojiItem)"
          class="emoji-item"
        >
          {{ emojiItem }}
        </button>
      </div>
    </div>
    <button type="submit" [disabled]="!newMessageText.trim()" class="send-btn" title="Send" aria-label="Send">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="send-icon">
        <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
      </svg>
    </button>
  </form>
</div>
